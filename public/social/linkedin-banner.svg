<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- background -->
  <rect width="1584" height="396" fill="#fcfaf6"/>

  <!-- subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#14110d" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- LinkedIn covers a circular avatar bottom-left, so safe text starts ~100px from top, generous left margin -->

  <!-- eyebrow with pulse -->
  <g transform="translate(120, 90)">
    <rect x="0" y="-9" width="9" height="9" fill="#1a8554"/>
    <text x="20" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" letter-spacing="2.4" fill="#6e6553">LISBON · WRITING IN PUBLIC</text>
  </g>

  <!-- main headline -->
  <text x="120" y="200" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="320" letter-spacing="-1.2" fill="#14110d">A synthesizer of ideas for the <tspan font-style="italic">agent-economy</tspan>.</text>

  <!-- tagline -->
  <text x="120" y="260" font-family="'Inter Tight', sans-serif" font-size="20" fill="#3d362d">Notes on technology, institutions, and what we're optimising for beneath the strategy.</text>

  <!-- right-side wordmark + URL -->
  <g transform="translate(1464, 90)">
    <text x="0" y="0" text-anchor="end" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="500" letter-spacing="-0.66" fill="#14110d">Bernardo Faro</text>
    <rect x="3" y="-9" width="8" height="8" fill="#1a8554"/>
  </g>
  <text x="1464" y="115" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.8" fill="#a09680">BERNARDOFARO.COM</text>
</svg>
